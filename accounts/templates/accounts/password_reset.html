{% load static %}
<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>بازنشانی رمز عبور</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" dir="rtl">

<div class="container" style="max-width: 450px;">
  <div class="card shadow p-4">
    <h3 class="text-center mb-4">بازنشانی رمز عبور</h3>
    <form method="post">
      {% csrf_token %}
      {{ form.email|add_attrs:"class:form-control,placeholder:ایمیل" }}
      <div class="text-center mt-3">
        <button type="submit" class="btn btn-primary px-4 py-2">ارسال لینک بازنشانی</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
