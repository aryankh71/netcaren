{% load static %}
<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>تغییر رمز عبور</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" dir="rtl">

<div class="container" style="max-width: 450px;">
  <div class="card shadow p-4">
    <h3 class="text-center mb-4">رمز عبور جدید</h3>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          {{ field|add_attrs:"class:form-control" }}
          {% if field.errors %}
            {% for error in field.errors %}
              <div class="text-danger small mt-1">{{ error }}</div>
            {% endfor %}
          {% endif %}
        </div>
      {% endfor %}
      <div class="text-center">
        <button type="submit" class="btn btn-primary px-4 py-2">تغییر رمز</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
