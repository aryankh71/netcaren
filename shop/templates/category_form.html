<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <title>افزودن دسته‌بندی جدید</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background-color: #f8f9fa; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 5px; box-shadow: 0 0 5px #ccc; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], input[type="submit"], button {
            width: 100%; padding: 8px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px;
            font-size: 16px;
        }
        .btn-primary { background-color: #007bff; color: white; border: none; cursor: pointer; }
        .btn-primary:hover { background-color: #0069d9; }
        .btn-secondary { background-color: #6c757d; color: white; border: none; cursor: pointer; }
        .btn-secondary:hover { background-color: #5a6268; }
        .text-danger { color: #dc3545; font-size: 14px; margin-top: -10px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h3>افزودن دسته‌بندی جدید</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.name.label_tag }}
        {{ form.name }}
        {% if form.name.errors %}
            <div class="text-danger">{{ form.name.errors }}</div>
        {% endif %}
        <input type="submit" class="btn-primary" value="ذخیره" />
        <button type="button" class="btn-secondary" onclick="window.close();">انصراف</button>
    </form>
</div>

</body>
</html>
